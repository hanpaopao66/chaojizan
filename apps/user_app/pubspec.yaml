name: user_app
description: Super-Z 用户端 —— 点外卖
version: 0.1.0
publish_to: none

environment:
  # 抬到 3.6.2 是被 liquid_glass_easy 的下限顶上来的。写 ^3.4.0 也能解析
  # (取交集),但那是句假话:拿 3.4 的 SDK 来构建会直接失败
  sdk: ^3.6.2

dependencies:
  flutter:
    sdk: flutter
  superz_shared:
    path: ../../packages/shared
  web_socket_channel: ^3.0.0 # 订单状态实时推送
  geolocator: ^14.0.0        # 附近商家用真实定位
  url_launcher: ^6.3.2       # 一键拨号联系骑手/商家
  image_picker: ^1.1.0       # 头像上传
  qr_flutter: ^4.1.0
  package_info_plus: ^8.0.0  # 关于页展示版本号
  shared_preferences: ^2.5.5
  share_plus: ^12.0.2
  flutter_tencent_map: 1.0.1
  video_player: ^2.9.2       # 明厨亮灶直播(HLS,安卓走 ExoPlayer / iOS 走 AVPlayer)
  webview_flutter: ^4.8.0    # 小程序容器(#279,手机端:原生 WebView)
  # 小程序调试开关(#331):安卓 enableDebugging、iOS setInspectable 在平台实现包里
  webview_flutter_android: ^4.14.0
  webview_flutter_wkwebview: ^3.26.0
  # 液态玻璃:只给用户端,**不进 shared** —— 进了 shared 就等于把 6 个
  # 着色器一并塞进商家端和骑手端的包里,而那两端不用这个效果
  liquid_glass_easy: ^4.2.0
  # web 端小程序容器(#292):跨域 iframe + postMessage。
  # 浏览器不许父页面往跨域 iframe 注入 JS,所以页面要自己引
  # /mini-app-bridge.js —— 和 Telegram 要求引 telegram-web-app.js 同理
  web: ^1.1.0
  # 消息(DEV-PROMPTS-40):发文件、录语音、放语音
  file_picker: ^11.0.3       # 选任意文件发出去
  record: ^7.1.1             # 按住录语音(安卓 AAC,网页 opus,服务端统一转成 m4a)
  audioplayers: ^6.8.1       # 放语音消息(和商家端听单同一个库)
  path_provider: ^2.1.6      # 录音文件和下载的文件落应用私有目录

flutter:
  uses-material-design: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  # 只给测试用:MockClient 把 ApiClient 的传输层换掉,
  # 「我的」页才能在没有后端的情况下按真机口径量密度
  http: ^1.2.0

# App 图标(生成:dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: false
  image_path: ../../assets/brand/icon.png
  adaptive_icon_background: "#F05030"
  adaptive_icon_foreground: ../../assets/brand/icon_fg.png
