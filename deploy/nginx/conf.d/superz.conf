# 超级赞公网入口:公网 → 云端 frps(:80/:443) → frpc 隧道 → 本 nginx(8880/8443)
# TLS 在这里终结,证书在 ../certs(部署机本地,不入库;续期见 renew-cert.sh)。
# 历史域名的 server 块放服务器本地 legacy-*.conf(rsync 排除,不入库)。

# ---------------------------------------------------------------------------
# 响应压缩。放在 nginx 而不是 FastAPI,有两个具体理由:
#
# 1. Starlette 的 GZipMiddleware **不看 content-type**,会把明厨亮灶快照
#    (image/jpeg,merchants.py 直接 Response 出去的)和导出流一起压一遍 ——
#    已经压过的二进制再压一次,纯烧 CPU;
# 2. api 是**单进程** uvicorn(见 server/Dockerfile 里 --workers 1 那段),
#    Python 侧压缩是在事件循环里同步做的,压一个响应就卡住所有请求。
#
# 三端的 JSON 字段名重复度极高,压缩比非常好(实测 gzip-5):
#
#     首页 /merchants     18526 → 约 1000 字节   省 95%
#     订单列表 /orders     39327 → 约 2800 字节   省 93%
#     券 /vouchers        26725 → 约 1500 字节   省 94%
#
# ⚠️ gzip_proxied 必须显式设成 any:默认值 off 意味着**反代来的响应一律不压**,
# 而本站除了证书挑战之外全是反代 —— 漏了这一行等于整段配置没写。
gzip on;
gzip_proxied any;
gzip_vary on;
# 5 是速度和体积的折中:实测从 5 提到 9,首页只再省 3 字节,耗时翻三倍。
# 这台机器 4 核还压着 db/redis/minio/api,不值得为那点体积多烧 CPU
gzip_comp_level 5;
# 小响应压了反而更大(gzip 自己有 ~20 字节头),且省的那点不值一次系统调用
gzip_min_length 512;
# 白名单里**不放** image/* 和 application/octet-stream:
# JPEG/PNG/APK 都已经是压缩格式,再压一遍只出 CPU 不出效果
gzip_types
    application/json
    application/javascript
    application/manifest+json
    application/xml
    text/css
    text/javascript
    text/plain
    text/xml
    image/svg+xml;

map $http_upgrade $superz_connection {
    default upgrade;
    ""      close;
}

# ---------------------------------------------------------------------------
# 访问日志里给 Bot API 的 token 打码(#355)。
#
# 机器人调 `/bot/<token>/<method>`(和 Telegram 一样 token 在路径里),而访问日志缺省记整条请求行 ——
# 不打码的话,每个机器人的 token 都原样躺在宿主机的日志里。应用那一层已经在最外层中间件打过码
# (server/app/main.py 的 BotTokenPathMiddleware),这里是 nginx 自己那一份:只留 token 前 6 位,
# 其余字段和官方镜像缺省的 main 格式一样。
#
# 三个 server 块都要写 access_log ... superz_masked:写在 http 层的话,和镜像 nginx.conf 里那条
# `access_log ... main` 是**两条都生效**,同一个请求记两遍,其中一遍照样是完整 token。
# 已知局限:error.log 里的 `request: "…"`(比如上游 502)没法按格式打码。
# 在 nginx:1.27-alpine 上实测:`/bot/123456:AAAA…/getMe?x=1` 记成 `/bot/123456***/getMe?x=1`。
map $request_uri $superz_log_uri {
    "~^(?<superz_bot_head>/bot/[^/?]{0,6})[^/?]*(?<superz_bot_tail>.*)$" "${superz_bot_head}***${superz_bot_tail}";
    default $request_uri;
}
log_format superz_masked '$remote_addr - $remote_user [$time_local] '
                         '"$request_method $superz_log_uri $server_protocol" $status $body_bytes_sent '
                         '"$http_referer" "$http_user_agent" "$http_x_forwarded_for"';

# ---------------------------------------------------------------------------
# 真实来源 IP:frp 隧道的 proxy protocol。
#
# frp 是 **TCP** 隧道,nginx 看到的连接一律来自本机 frpc(docker 网关 172.x)——
# 不做这一步,全站所有人在 api 眼里是同一个 IP,按 IP 的限流就成了全站共用一个桶
# (验证码「同 IP 每日 20 条」一天锁死所有新用户,/screen 120/分钟被几台电视刷光)。
#
# 做法:frpc 每条隧道开 `transport.proxyProtocolVersion = "v2"`(见 tunnel/frpc.toml.example),
# 在 TCP 连接最前面带上真实客户端地址;nginx 在**另开的端口**上用 `proxy_protocol` 接,
# 再用 realip 把 $remote_addr 换成它。
#
# 为什么另开端口(81 / 444,compose 只发布在 127.0.0.1)而不是给 80/443 加 proxy_protocol:
#   - 加了 proxy_protocol 的端口**只认**带头的连接,本机/局域网直连 8443 的冒烟、调试会全部断;
#   - 上线可以分两步:先让 nginx 把新端口开起来,再改 frpc 指过去,中间不断站。回退只改 frpc;
#   - 只绑 127.0.0.1:局域网里的机器连不上这两个端口,也就没法自己伪造 proxy protocol 头冒充别人。
#
# realip 只信 proxy protocol 头,而且只信来自 docker 网段 / 本机的连接(frpc 经 docker 发布端口进来,
# 源地址是 docker 网关)。普通 80/443 端口上的连接没有这个头,$proxy_protocol_addr 为空,realip 不动它。
set_real_ip_from 127.0.0.1;
set_real_ip_from 172.16.0.0/12;
real_ip_header proxy_protocol;
# 相对跳转(`return 301 /web/`、目录补斜杠)缺省会带上 nginx 自己监听的非标准端口,
# 从 444 进来的请求就会被跳到 https://chaojizan.cc:444/…。对外永远是 80/443,端口不写进跳转
port_in_redirect off;

# [staging] http-end —— 以上 http 级配置,预发环境原样照抄(scripts/gen_staging_nginx.py 认这三个标记,别改字)

server {
    listen 80;
    listen 81 proxy_protocol;   # frp 隧道进来的(带真实 IP),见上面「真实来源 IP」
    server_name _;
    access_log /var/log/nginx/access.log superz_masked;

    # 证书签发/续期挑战(certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# chaojizan.cc:2026-07-27 备案通过,证书已签(含 www,renew-cert.sh 每周自动续期)。

# www 统一 301 到主域(证书同一张,SAN 含 www)
server {
    listen 443 ssl;
    listen 444 ssl proxy_protocol;
    server_name www.chaojizan.cc;
    access_log /var/log/nginx/access.log superz_masked;

    ssl_certificate     /etc/nginx/certs/chaojizan/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/chaojizan/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://chaojizan.cc$request_uri;
}

server {
    listen 443 ssl;
    listen 444 ssl proxy_protocol;
    server_name chaojizan.cc;
    access_log /var/log/nginx/access.log superz_masked;

    ssl_certificate     /etc/nginx/certs/chaojizan/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/chaojizan/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # [staging] locations-begin —— 从这里到 locations-end,预发环境原样照抄(证书和门禁由预发自己加)
    client_max_body_size 10m;

    # 公开图片直接由 MinIO 出(#125):不经过 api 进程,省一次 Python 转发。
    # **只反代 public 桶**。private 桶在这里没有任何 location ——
    # 证照/送达留证只能走 api 的 /files/{key},每次都要过判权。
    # 少写这一条就是隐私改造的意义所在,别"顺手也给 private 配一个"。
    location /img/ {
        # 用变量 + resolver 让 upstream 在**请求时**解析,而不是 nginx 启动时。
        # 写死主机名的话,MinIO 没起来 nginx 就直接起不来 —— 图片挂了是小事,
        # 整个站点连不上是大事。127.0.0.11 是 Docker 内置 DNS
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $minio_upstream http://superz-minio:9000;
        rewrite ^/img/(.*)$ /superz-public/$1 break;
        proxy_pass $minio_upstream;
        proxy_set_header Host $host;
        # 图片按内容寻址(uuid 文件名),内容不会变,可以放心长缓存
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # 别拿内容去猜类型。上传侧已经按魔数拒绝非图片,这是第二道 ——
        # 存量里可能还有走过老回退路径(认不出就用文件名后缀)的文件
        add_header X-Content-Type-Options "nosniff" always;
        # MinIO 挂了不要把 502 直接甩给用户:回落到 api(它也能读桶)
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @img_fallback;
    }

    # 私密媒体直出(DEV-PROMPTS-40 #375,MEDIA_ACCEL=true):api 判完权回
    # X-Accel-Redirect: /_minio_internal/<桶>/<key>?<预签名参数>,nginx 带着预签名去 MinIO 取,
    # Range / 拖进度条由 MinIO 处理 —— 视频、大文件不经过 Python。
    #
    # internal:浏览器直接请求这个前缀一律 404,只认 api 发出来的内部跳转;预签名 120 秒过期。
    # Host 必须和签名时的 endpoint 一字不差(server 的 MINIO_ENDPOINT,缺省 minio:9000),
    # 不然 MinIO 回 403 SignatureDoesNotMatch。改 MINIO_ENDPOINT 时这里一起改
    location /_minio_internal/ {
        internal;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $minio_internal http://superz-minio:9000;
        rewrite ^/_minio_internal/(.*)$ /$1 break;
        proxy_pass $minio_internal;
        proxy_set_header Host minio:9000;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_hide_header Set-Cookie;
        proxy_buffering off;
        # MinIO 自己的 Content-Type 盖不过 api 定的那个(文件类一律 octet-stream,防上传的 HTML 在本域执行)
        proxy_hide_header Content-Type;
    }

    location @img_fallback {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_fallback http://superz-api:8000;
        proxy_pass $api_fallback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # 覆盖而非追加,理由见 location /
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 用户端网页版(Flutter web)。不经过 api:发版时 scripts/sync_release_to_appdist.sh
    # 把 Release 里的 chaojizan-web.tar.gz 核过哈希,解压到部署机
    # ~/super-z/webapp/releases/<tag>/,再把 ~/super-z/webapp/current 软链切过去
    # (compose 把 ~/super-z/webapp 只读挂到这里的 /srv/webapp)。回滚 = 软链切回上一版。
    # 还没发过网页版时这里一律 404,不影响站点其他部分。
    #
    # 缓存口径同 mini_host.py:入口和不带版本号的文件每次回源确认(no-cache,
    # 靠 ETag 拿 304,不重下;打包时文件时间戳按内容算,没变的文件换版后 ETag 也不变);
    # 路径里带着版本的(字体回落 notosanssc/v37/…)内容不会变,长缓存。
    # Flutter 产物的文件名不带内容哈希(main.dart.js 每版同名),所以不能像 /img/ 那样
    # 一律长缓存 —— 那样发了新版,老用户要等缓存过期才看得到。
    # 文本和 wasm 打包时就压好了 .gz,gzip_static 直接发(wasm、ttf 不在上面 gzip_types 里)。
    location = /web {
        return 301 /web/;
    }
    location ^~ /web/fontfallback/ {
        alias /srv/webapp/current/fontfallback/;
        try_files $uri =404;
        # 不加 always:长缓存只给 200。一个 404(比如切版本的那一瞬间)被浏览器记一年就麻烦了
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }
    location ^~ /web/ {
        alias /srv/webapp/current/;
        index index.html;
        gzip_static on;
        # 单页应用:认不出的路径交给 index.html(现在是 # 路由,这条是给直达链接和以后换路径路由留的)
        try_files $uri $uri/ @web_index;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location @web_index {
        # 带扩展名的(main.dart.js、assets/… 这类)找不到就是 404,别拿首页冒充 ——
        # 引擎拿一张 HTML 当图片、当字体去解,报出来的错比 404 难查得多
        if ($uri ~ "\.[A-Za-z0-9]+$") {
            return 404;
        }
        root /srv/webapp/current;
        try_files /index.html =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        # 同 /img/:变量 + resolver,在**请求时**解析 upstream。
        # 写死主机名的话 nginx 只在启动时解析一次,api 容器一被重建换了 IP,
        # nginx 就一直往旧 IP 打,整站 502 —— 实测踩过:
        # 加 minio 服务导致容器 IP 重排,nginx 记着 172.24.0.7 而 api 已是 .6,
        # 必须手动 restart nginx 才恢复。这条让它自愈
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://superz-api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # X-Forwarded-For **覆盖**成 $remote_addr(realip 之后就是真实客户端),不用
        # $proxy_add_x_forwarded_for:那个是追加,客户端自己带一个 XFF 就能排在最左边,
        # 而 api 的 client_ip() 取的正是最左边那个 —— 等于谁都能给自己换个 IP 绕开限流
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket(商家听单/骑手推送)升级头;长连接读超时放宽到 1h
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $superz_connection;
        proxy_read_timeout 3600s;
    }
    # [staging] locations-end
}
