# 超级赞公网入口:公网 → 云端 frps(:80/:443) → frpc 隧道 → 本 nginx(8880/8443)
# TLS 在这里终结,证书在 ../certs(部署机本地,不入库;续期见 renew-cert.sh)。
# 历史域名的 server 块放服务器本地 legacy-*.conf(rsync 排除,不入库)。

map $http_upgrade $superz_connection {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    # 证书签发/续期挑战(certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# chaojizan.cc:2026-07-27 备案通过,证书已签(含 www,renew-cert.sh 每周自动续期)。

# www 统一 301 到主域(证书同一张,SAN 含 www)
server {
    listen 443 ssl;
    server_name www.chaojizan.cc;

    ssl_certificate     /etc/nginx/certs/chaojizan/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/chaojizan/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://chaojizan.cc$request_uri;
}

server {
    listen 443 ssl;
    server_name chaojizan.cc;

    ssl_certificate     /etc/nginx/certs/chaojizan/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/chaojizan/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;

    # 公开图片直接由 MinIO 出(#125):不经过 api 进程,省一次 Python 转发。
    # **只反代 public 桶**。private 桶在这里没有任何 location ——
    # 证照/送达留证只能走 api 的 /files/{key},每次都要过判权。
    # 少写这一条就是隐私改造的意义所在,别"顺手也给 private 配一个"。
    location /img/ {
        # 用变量 + resolver 让 upstream 在**请求时**解析,而不是 nginx 启动时。
        # 写死主机名的话,MinIO 没起来 nginx 就直接起不来 —— 图片挂了是小事,
        # 整个站点连不上是大事。127.0.0.11 是 Docker 内置 DNS
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $minio_upstream http://superz-minio:9000;
        rewrite ^/img/(.*)$ /superz-public/$1 break;
        proxy_pass $minio_upstream;
        proxy_set_header Host $host;
        # 图片按内容寻址(uuid 文件名),内容不会变,可以放心长缓存
        proxy_hide_header Set-Cookie;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=2592000, immutable";
        # MinIO 挂了不要把 502 直接甩给用户:回落到 api(它也能读桶)
        proxy_intercept_errors on;
        error_page 404 502 503 504 = @img_fallback;
    }

    location @img_fallback {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_fallback http://superz-api:8000;
        proxy_pass $api_fallback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # 同 /img/:变量 + resolver,在**请求时**解析 upstream。
        # 写死主机名的话 nginx 只在启动时解析一次,api 容器一被重建换了 IP,
        # nginx 就一直往旧 IP 打,整站 502 —— 实测踩过:
        # 加 minio 服务导致容器 IP 重排,nginx 记着 172.24.0.7 而 api 已是 .6,
        # 必须手动 restart nginx 才恢复。这条让它自愈
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://superz-api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket(商家听单/骑手推送)升级头;长连接读超时放宽到 1h
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $superz_connection;
        proxy_read_timeout 3600s;
    }
}
