# 生产栈(内网穿透部署:局域网机器上跑,经 frp 隧道对外)
#
#   公网用户 → 域名(云端 frps :80/:443)
#            → TCP 隧道(frpc,本文件) → 本机 nginx(8880/8443,本文件,TLS 终结)
#            → superz-api:8000
#
# 入口自持:隧道/网关/API/数据全栈一个 compose 拉起。
# 启动:cd deploy && docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# .env.prod 不入库,需含 POSTGRES_PASSWORD / JWT_SECRET(生成:openssl rand -hex 32);
# SMS_* / TIANDITU_* / GITHUB_* 等运行配置也在其中,经 env_file 全量进 api 容器
# 日志轮转:不设上限的话 docker json 日志只增不减,最后把盘吃满 ——
# 而磁盘满会同时干掉数据库和对象存储,是最难看的一种宕机
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    logging: *default-logging
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    # max_connections 显式写出来,而不是靠镜像默认值。
    #
    # 这个数字和 server/app/config.py 里的 db_pool_size / db_max_overflow
    # 是**一对必须同时看的数字**:api 曾经以 --workers 4 起,
    # 4 × (10 + 20) = 120 > 默认的 100,高峰期后来的连接被库直接拒掉,
    # 表现是随机 500 —— 而不是变慢,所以压测复现不出来。
    #
    # 现在的账:api 1 个进程 30 + sweeper 1 个进程 30 = 60,
    # 加 3 个超级用户保留位、迁移容器和人工 psql/pg_dump 的临时连接,
    # 100 有富余。**不要为了"保险"往上调**:每条连接在这台
    # 4 核 / 可用内存 4.4G 的机器上都要几 MB,而机器上还压着
    # redis/minio/nginx/frpc/witness,调大只会更早 OOM
    command: >
      postgres -c max_connections=100
    environment:
      POSTGRES_USER: superz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.prod}
      POSTGRES_DB: superz
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superz"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    logging: *default-logging
    image: redis:7-alpine
    restart: unless-stopped

  # 一次性迁移容器:跑完 alembic upgrade head 就退出,api/sweeper 等它成功再起。
  #
  # 为什么要单拎出来:迁移原先写在 api 的 lifespan 里,而 api 是 --workers 4,
  # 于是**四个进程同时** upgrade,一起去读写 alembic_version。
  # 平时怎么重启都风平浪静,只在"恰好这次部署带了迁移"时出事 ——
  # 最难复现也最不该赌的那一类。现在只有这一个地方会跑,
  # 加上 app/startup.py 里的 PostgreSQL 咨询锁双保险。
  migrate:
    logging: *default-logging
    build: ../server
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://superz:${POSTGRES_PASSWORD}@db:5432/superz
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set in .env.prod}
    command: python -m app.startup
    restart: "no"     # 一次性任务,失败就该停在那里让人看见
    depends_on:
      db:
        condition: service_healthy

  api:
    logging: *default-logging
    build: ../server
    container_name: superz-api
    restart: unless-stopped
    # .env.prod 全量注入(短信/天地图/GitHub 等开关配置改了重启即生效);
    # 下面 environment 里的几项优先级更高,负责拼接容器内地址和进程角色
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://superz:${POSTGRES_PASSWORD}@db:5432/superz
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set in .env.prod}
      # 迁移交给上面的 migrate 容器,清扫交给下面的 sweeper 容器。
      # api 只负责收请求 —— 这两件事都只该有一份,而 web 进程是最不适合
      # 承载"只跑一份"的地方(它天然想横向扩)
      RUN_MIGRATIONS_ON_STARTUP: "false"
      AUTO_FLOW_ENABLED: "false"
    # 127.0.0.1:8010 仅本机运维调试;公网流量走本栈 nginx 转发
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - uploads:/srv/uploads
      # APK 分发目录:发版脚本 scripts/release_apks.sh 往这里传包和 versions.json
      - /home/dddd/super-z/appdist:/srv/appdist
      # 见证节点脚本(/witness.py 下载端点读 /witness;构建上下文只有 server/,挂载补上)
      - /home/dddd/super-z/witness:/witness:ro
      # 微信支付商户密钥(apiclient_key.pem + pub_key.pem)。部署机本地仅存、
      # rsync 排除、不打进镜像;容器 WORKDIR=/srv,故 .env.prod 里写 certs/xxx.pem
      - ./wxpay-certs:/srv/certs:ro
    depends_on:
      db:
        condition: service_healthy
      # 迁移**跑完并成功**再起 api。之前是 api 自己边起边迁,
      # 于是"结构还没改完就开始收请求"有一个真实存在的窗口
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  # 后台清扫:与 api 同一个镜像,不同 command(见 server/app/sweeper.py)。
  #
  # 原先 auto_flow_loop 挂在 api 的 lifespan 里,而 api 是 --workers 4,
  # 于是**四份循环同时扫同一批订单**:超时退款、自动确认、发安抚券、
  # 生成账本锚点。靠 Redis 防重键和行锁挡住了大部分重复,但那是"没出事",
  # 不是"设计上不会出事" —— 账本锚点一天一条、按哈希链串起来,
  # 重复执行的代价格外难收拾。
  #
  # 不监听端口,所以不需要 ports;崩了由 restart 拉起来。
  sweeper:
    logging: *default-logging
    build: ../server
    container_name: superz-sweeper
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DATABASE_URL: postgresql+asyncpg://superz:${POSTGRES_PASSWORD}@db:5432/superz
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?set in .env.prod}
      # 清扫进程**就是**那唯一一份 auto_flow;迁移仍然只归 migrate 容器
      AUTO_FLOW_ENABLED: "true"
      RUN_MIGRATIONS_ON_STARTUP: "false"
    command: python -m app.sweeper
    volumes:
      # 清扫要碰上传目录(明厨亮灶抽帧、证照到期扫描)和商户密钥(自动退款)
      - uploads:/srv/uploads
      - ./wxpay-certs:/srv/certs:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
      minio:
        condition: service_healthy

  # 自建对象存储(#125)。**故意不写 ports** —— 9000/9001 都不对宿主机暴露:
  # 公开桶经本栈 nginx 的 /img/ 出去,私密桶只由 api 内网访问,
  # 控制台要用就走 SSH 隧道。单节点单盘,不上纠删码(4 核 / 可用内存 4.4G,
  # 机器上还有别的栈,给它 1g 上限就够)
  minio:
    logging: *default-logging
    image: minio/minio:latest
    container_name: superz-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env.prod}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 1g

  # 一次性建桶 + 设策略,跑完即退。每次 up 都会重跑,mb -p 与 anonymous set
  # 都是幂等的 —— 顺带保证「私密桶不可匿名读」这条每次部署都被重新确认一遍
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set in .env.prod}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env.prod}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/superz-public &&
      mc mb -p local/superz-private &&
      mc anonymous set download local/superz-public &&
      mc anonymous set none local/superz-private &&
      echo 'buckets ready'
      "

  # 公网入口:TLS 终结 + 按域名分发。证书/挑战目录都在部署机本地(不入库,
  # rsync 排除;见 renew-cert.sh)。8880/8443 与 frpc 的 localPort 对应
  nginx:
    logging: *default-logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8880:80"
      - "8443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - api

  # 内网穿透客户端:把云端 frps 的 80/443 引到本机 nginx。
  # tunnel/frpc.toml 含隧道 token,只存部署机(rsync 排除)
  frpc:
    logging: *default-logging
    image: snowdreamtech/frpc
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./tunnel/frpc.toml:/etc/frp/frpc.toml:ro

  # 官方常驻见证节点:跑的是公众下载的同一份脚本,且刻意走公网域名拉账本
  # (不内网直连 api——见证的就该是公众看到的那份数据)。锚点留存在卷里,
  # 容器重建不丢。域名不入库:.env.prod 写 WITNESS_API=https://对外域名
  witness:
    logging: *default-logging
    build: ../witness
    container_name: superz-witness
    restart: unless-stopped
    environment:
      SUPERZ_API: ${WITNESS_API:-https://chaojizan.cc}
      WITNESS_NAME: ${WITNESS_NAME:-官方部署机}
      WITNESS_REGION: ${WITNESS_REGION:-}
    volumes:
      - witness-data:/data

volumes:
  pgdata:
  minio_data:
  uploads:
  witness-data:
