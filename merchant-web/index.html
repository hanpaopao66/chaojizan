<!doctype html>
<!--
  data-theme="light" 是**故意钉死的**,不是忘了做深色态。

  tokens.css 带了整套深色值(和 App 共用一个源),而这个后台的 23 个页面
  一个都没按深色设计过 —— antd 的 ConfigProvider 这边只给了 szLight。
  不钉的话:系统开深色时页底变深、antd 卡片还是浅色,而卡片里的文字
  用的是 var(--sz-ink-muted),会解析成深色态的 #A8A49A 贴在浅底上,
  对比度掉到 2.5。半深半浅比纯浅色糟得多。

  要做深色态得三件事一起来:ConfigProvider 换 szDark + theme.darkAlgorithm、
  23 个页面逐个过一遍、再把这个属性改成跟随系统。在那之前先钉住。
-->
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>超级赞商家工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
