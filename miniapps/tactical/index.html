<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="color-scheme" content="light dark">
  <title>突击时刻</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <main id="app" class="app">
    <!-- 首页 / 说明:内容由 src/main.ts 生成 -->
    <div id="screen" class="screens"></div>

    <section id="game" class="game" hidden aria-label="对局">
      <canvas id="field" class="field" role="img" tabindex="-1" aria-label="俯视战场:整张地图一屏可见"></canvas>

      <header id="hud-top" class="hud-top">
        <button id="pause" class="hud-btn" type="button" aria-label="暂停">Ⅱ</button>
        <div class="hud-mid">
          <p id="hud-round" class="hud-round">第 1 回合</p>
          <p class="hud-score" aria-label="比分">
            <b id="score-me">0</b><i>:</i><b id="score-them">0</b>
          </p>
        </div>
        <div id="hud-timer" class="hud-timer" aria-label="剩余时间">1:15</div>
        <button id="sound" class="hud-btn" type="button" aria-label="声音开关">声</button>
      </header>

      <p id="hud-banner" class="hud-banner" hidden aria-hidden="true"></p>
      <p id="hud-hit" class="hud-hit" hidden aria-hidden="true">×</p>

      <div id="hud-vitals" class="hud-vitals">
        <div id="hp" class="hp"><i id="hp-fill"></i></div>
        <b id="hp-num" class="hp-num">100</b>
      </div>
      <p id="bomb-status" class="bomb-status" hidden></p>

      <div id="hud-ammo" class="hud-ammo">
        <b id="ammo-mag">30</b><span class="slash">/</span><i id="ammo-res">90</i>
        <span id="reload-tip" class="reload-tip"></span>
      </div>

      <p id="hud-hint" class="hud-hint"></p>

      <div id="touch" class="touch" hidden>
        <div id="zone-move" class="zone zone-move"><div id="stick-move" class="stick" hidden><i class="knob"></i></div></div>
        <div id="zone-aim" class="zone zone-aim"><div id="stick-aim" class="stick" hidden><i class="knob"></i></div></div>
        <div class="touch-btns">
          <button id="btn-plant" class="tbtn plant" type="button" hidden>安放</button>
          <button id="btn-reload" class="tbtn" type="button">换弹</button>
        </div>
      </div>
    </section>
  </main>

  <div id="overlay" class="overlay" hidden></div>
  <p id="live" class="sr" aria-live="polite"></p>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
