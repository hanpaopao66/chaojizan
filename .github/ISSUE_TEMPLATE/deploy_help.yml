name: 部署求助
description: 在自己的城市/服务器部署时卡住了
labels: ["deploy"]
body:
  - type: markdown
    attributes:
      value: |
        先照 [开城手册](../blob/main/docs/OPEN-A-CITY.md) 走一遍 ——
        它按时间顺序覆盖了成本、资质、配置、验收。卡在手册没写到的地方,
        这本身就是手册的 bug,欢迎报。
  - type: input
    id: step
    attributes:
      label: 卡在手册的哪一步
      placeholder: 例:第 4 步跑迁移,alembic 报 ……
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: 环境
      description: 系统、Docker 版本、部署方式(compose 全栈 / 分开跑)
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 报错原文
      description: 贴日志前检查一遍,别把 .env 里的密钥贴进来
    validations:
      required: true
