name: CI

# 让"跑没跑测试"不再取决于人的记性(#128)。
#
# 此前全靠本地手动 make test,而 make test 本身只覆盖 117 个 e2e 里的 50 个。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 服务端 e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: superz
          POSTGRES_PASSWORD: superz
          POSTGRES_DB: superz
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U superz"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    env:
      # **CI 是开发环境,必须显式声明。** 安全开关(模拟支付、管理员密码登录、
      # 验证码回显、二要素未配置放行)现在默认按生产处理 —— 忘了配的后果
      # 是这几样不可用,而不是生产上某道校验被跳过。e2e 依赖模拟支付,
      # 所以这里要有它;线上的 .env.prod **不许**有这一行。
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://superz:superz@localhost:5432/superz
      REDIS_URL: redis://localhost:6379/0
      # 生产是 minio,CI 也用 minio:两边跑同一条代码路径
      STORAGE_BACKEND: minio
      MINIO_ENDPOINT: localhost:9000
      MINIO_ACCESS_KEY: superz
      MINIO_SECRET_KEY: superz-ci-secret
      MINIO_SECURE: "false"
      # **必须关掉**:后台清扫会和用例自己调的 sweep_once 抢同一批订单,
      # 表现为 e2e_auto_flow 时好时坏(本地踩过)
      AUTO_FLOW_ENABLED: "false"
      SUPERZ_API: http://127.0.0.1:8010
      # seed.py 见到 STORAGE_BACKEND=minio 会认定"这是生产",把演示口令随机化
      # (不留人人可登的后门)。CI 偏偏要用 minio 跑生产的存储路径,所以在这里
      # 显式给一个口令 —— 那条生产保护本身不该为 CI 放宽。每次跑都不一样
      SEED_DEMO_PASSWORD: ci-${{ github.run_id }}
      # 全套 e2e 从同一个 127.0.0.1 发几十条注册短信,会撞上"同 IP 每日 20 条"
      # 的防刷闸门。生产那个 20 是对的,不能为 CI 调低 —— 这里只在 CI 抬高。
      # 注意仍**不放宽同手机号 8 条/滑块**那两条,e2e_auth_sms 正是在测它们。
      SMS_DAILY_IP_LIMIT: "100000"
      # 同理:全套 e2e 从同一个 127.0.0.1 注册几十个账号,
      # 而注册限流按 IP 算。生产那个 5 是对的,只在 CI 抬高。
      RATE_LIMIT_REGISTER_PER_MINUTE: "100000"
      # 公开页(大屏/透明中心)的进程内缓存上限,0 = 不缓存。
      # /transparency/fairness 缓存 1 小时:干净库上第一次读把「隐藏 0 条」
      # 缓存住,e2e_review_hidden_appeal 之后隐藏了评价也读不出来。
      # 本地开发库积着历次跑出来的隐藏评价,所以那条断言在本地一直是绿的。
      PUBLIC_CACHE_MAX_SECONDS: "0"
      # 排队叫号宽限期。生产是 120 秒(商家叫号后不足这个时间不能标客人过号),
      # e2e 里真等 2 分钟 x2 会给每次 CI 加 4 分钟。
      # 注意**只调这个数,不是关掉这条规则** —— e2e_queue 仍然验
      # 「叫号当场标过号被拒」和「过了宽限期才能过号」两头。
      QUEUE_CALL_GRACE_SECONDS: "2"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: 安装依赖
        working-directory: server
        run: pip install -r requirements.txt

      # MinIO 不作为 service 容器起:它需要 `server /data` 这个 command,
      # 而 GitHub 的 service 容器给不了 command。
      #
      # 镜像用**生产同款** minio/minio。原先用的 bitnami/minio 公开 tag 已被
      # 下架(Bitnami 2025 年把免费镜像挪走了),CI 直接拉不到 ——
      # 而且 CI 和生产用不同的镜像本来就违背"同一套东西"的原则
      - name: 起 MinIO(生产同款镜像)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=superz \
            -e MINIO_ROOT_PASSWORD=superz-ci-secret \
            minio/minio server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && break
            sleep 2
          done
          curl -sf http://127.0.0.1:9000/minio/health/live \
            || { echo "MinIO 起不来"; docker logs minio; exit 1; }

      # 桶名与生产一致 —— 本地/CI/生产用同一套名字,才不会"CI 绿了线上炸"。
      # 用服务端本来就依赖的 python minio 客户端建,不为 CI 再装一个 mc
      - name: 建桶
        working-directory: server
        run: |
          python - <<'PY'
          from minio import Minio
          c = Minio("localhost:9000", access_key="superz",
                    secret_key="superz-ci-secret", secure=False)
          for b in ("superz-public", "superz-private"):
              if not c.bucket_exists(b):
                  c.make_bucket(b)
              print("bucket", b, "ok")
          PY

      - name: 迁移 + 种子数据
        working-directory: server
        run: |
          export JWT_SECRET=ci-$GITHUB_RUN_ID
          alembic upgrade head
          python -m scripts.seed
          python -m scripts.demo_seed

      - name: 起服务
        working-directory: server
        # JWT_SECRET 在这里现造而不是写进 env: —— 安全扫描对
        # 对该变量的字面赋值一律拦截,那条规则不该为 CI 方便而放宽
        # (真泄露和假值长得一样)。每次跑用不同的值,也顺带避免串场
        run: |
          export JWT_SECRET=ci-$GITHUB_RUN_ID
          uvicorn app.main:app --host 0.0.0.0 --port 8010 > /tmp/api.log 2>&1 &
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8010/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          [ "$code" = "200" ] || { echo "API 起不来"; tail -40 /tmp/api.log; exit 1; }

      - name: e2e 回归
        # JWT_SECRET 要和上面起服务那步**同值**。
        #
        # 多数用例是走 HTTP 打真实服务的,进程里有没有这个变量都无所谓。
        # 但有的用例(e2e_refund_order)要在**测试进程内**跑 ASGI app ——
        # 只有进程内才拦得住真实的支付渠道调用。那时候测试进程自己要能
        # 验开服务端签发的 token,两边 secret 不一致就是一句
        # 「登录已过期,请重新登录」,而 token 明明是几秒前刚拿的。
        run: |
          export JWT_SECRET=ci-$GITHUB_RUN_ID
          make test

      - name: 失败时贴上服务端日志
        if: failure()
        run: tail -100 /tmp/api.log

  unit:
    name: 单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt
      - name: 安装依赖
        working-directory: server
        run: pip install -r requirements.txt pytest
      # 单测不连库不起服务,几秒内跑完 —— 慢了就没人跑
      - name: make unit
        run: make unit

  flutter:
    name: 三端静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # 设计令牌是从 brand.dart 生成的,这一步保证生成物没有跟源分叉。
      #
      # 放在装 Flutter 之前:纯 Python、几秒钟,分叉了就该立刻红,
      # 没必要先等三分钟的 SDK 下载。
      #
      # 为什么需要它:品牌主色一度在仓库里有三个不同的值 —— Flutter 的
      # #C15F3C、鸿蒙手抄成的 #C04026、后台写死的 #FF5A1F(而后者在
      # docs/BRAND.md 里标着「已废弃」)。人手同步的东西一定会分叉,
      # 只有让机器比对才不会。
      - name: 设计令牌一致性
        run: python3 scripts/gen_tokens.py --check
      # 两个后台是 TypeScript,而这个 job 此前只查 Flutter ——
      # admin-web / merchant-web 的类型错误在 CI 里一次都没被拦过,
      # 全靠本机手跑 tsc 才发现得了。放在装 Flutter 之前:node 装得快,
      # 类型错了就该立刻红,不用先等三分钟的 SDK 下载。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 后台类型检查
        run: |
          fail=0
          for d in admin-web merchant-web; do
            echo "── $d"
            (cd "$d" && npm ci --no-audit --no-fund >/dev/null \
              && npx tsc --noEmit) || fail=1
          done
          exit $fail
      # 频道色是功能不是装饰:首页一排图标,用户要一眼找到"打车"。
      # 「能不能一眼分开」是可以量的,而且**只能靠量** ——
      # 旧色板在绿色盲下最差色差 4.0(等于一排一样的方块),肉眼永远看不出来。
      - name: 频道色可分辨性
        run: python3 scripts/check_channel_tones.py
      # 中文衬线是**子集**,只覆盖源码里的固定文案。
      # 新加一句 UI 文案带了子集外的字,那个字会**默默**掉回系统黑体 ——
      # 同一个标题里一半宋体一半黑体,不报错、不崩、没人会注意到。
      # --check 只读已提交的子集 cmap,不下载 24MB 源字体。
      - name: 显示字覆盖率
        run: |
          pip install --quiet fonttools
          python3 scripts/gen_font_subset.py --check
      # 硬编码字号的棘轮:只许降不许涨。
      # 三端 737 处、34 种取值,一次改完不现实,但也不能继续发散 ——
      # 11 / 11.5 / 12 / 12.5 混着用,每个页面的层次都对不齐。
      - name: 字号不再发散
        run: bash scripts/check_fontsize_drift.sh
      # macOS 沙箱权限。flutter create 的模板里 Release 只有 app-sandbox,
      # 没有 network.client —— 少了它 release 版一个网络请求都发不出去,
      # 而 debug 版一切正常。平台目录被重新生成一次这条就又掉了。
      # 表现是"所有接口超时"不是权限错,查起来会往后端方向找。
      - name: macOS 权限声明
        run: python3 scripts/check_macos_entitlements.py
      # 宽屏布局:弹层走 szShowSheet、带 appBar 的页面走 SzPageScaffold。
      # 写成裸的在桌面上是"标题栏横跨 1440、按钮一米宽",
      # 而这**不报错** —— 功能全对、测试全绿,只是难用。
      - name: 宽屏布局走自适应外壳
        run: bash scripts/check_wide_layout.sh
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.6"
          channel: stable
          cache: true
      - name: analyze
        run: |
          fail=0
          for d in packages/shared apps/user_app apps/merchant_app apps/rider_app; do
            echo "── $d"
            (cd "$d" && flutter pub get >/dev/null && flutter analyze) || fail=1
          done
          exit $fail
      # 有测试的包都要跑。
      #
      # 以前这里只有 packages/shared,而 .gitignore 又把 apps/*/test/ 挡在
      # 仓库外 —— 商家端的小票版式测试在本机跑了很久、还被当成"版式已验证"
      # 的依据,实际上 CI 一次都没跑过。两个口子都堵上。
      #
      # 没有 test 目录的包跳过,不当失败。
      - name: dart 单测
        run: |
          fail=0
          for d in packages/shared apps/user_app apps/merchant_app apps/rider_app; do
            if [ -n "$(find "$d/test" -name '*_test.dart' 2>/dev/null)" ]; then
              echo "── $d"
              (cd "$d" && flutter test) || fail=1
            else
              echo "── $d(没有测试,跳过)"
            fi
          done
          exit $fail

  security:
    name: 私密信息扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks 要扫全历史,不能浅克隆
      # 仓库要开源:密钥/内网 IP/隧道细节/其他项目名都不该进来
      - run: bash scripts/security_scan.sh
      # 全历史密钥扫描(#276)。security_scan.sh 管的是当前工作区;
      # 历史里进过又删掉的东西它管不着,公开仓库的历史人人可翻 —— gitleaks 兜这个底。
      # 误报白名单在 .gitleaksignore(目前只有上游 jpush 插件文档的示例 Key)。
      #
      # 用 CLI 而不是 gitleaks-action:那个 action 在 push 事件下默认只扫
      # 本次推送的提交范围,而这里要的是**全历史**(第一次跑和第一百次跑
      # 结论必须一样)。`gitleaks git .` 的行为和开发机上跑的完全一致。
      # --redact:命中时日志里不回显密钥原文 —— CI 日志是公开的,
      # 报一个泄露不该顺手把它广播出去。
      - name: gitleaks(全历史)
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            zricethezav/gitleaks:latest git . --redact
