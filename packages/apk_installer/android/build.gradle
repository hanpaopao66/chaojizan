group 'com.chaojizan.apk_installer'
version '0.1.0'

// 不自己引 Kotlin Gradle Plugin:Flutter 已内置(built-in Kotlin),
// 插件再 apply 一遍会触发 "Future versions of Flutter will fail to build" 警告
buildscript {
    repositories {
        // 国内源只在国内网络上是加速,海外 runner 上是瓶颈。
        // Gradle 对 5xx/网络错误 fail fast,不会往下找官方源 ——
        // 镜像一抖整个解析就失败(2026-08-29 发 v0.14.3 时挂过)。
        // CI 设 SUPERZ_SKIP_CN_MIRROR=1 直连官方源;开发机不设照旧走镜像
        if (System.getenv('SUPERZ_SKIP_CN_MIRROR') != '1') {
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/google' }
        }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.0'
    }
}

rootProject.allprojects {
    repositories {
        if (System.getenv('SUPERZ_SKIP_CN_MIRROR') != '1') {
            maven { url 'https://maven.aliyun.com/repository/public' }
            maven { url 'https://maven.aliyun.com/repository/google' }
        }
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'com.chaojizan.apk_installer'
    compileSdk 35

    defaultConfig {
        minSdk 21
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
