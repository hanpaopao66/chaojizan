name: superz_shared
description: Super-Z 三端共享代码:数据模型、API 客户端、通用登录页
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  apk_installer:            # 自建渠道的应用内下载安装(#123)
    path: ../apk_installer
  # 图片磁盘缓存:Flutter 自带的 Image.network 只有内存缓存,杀进程就没了。
  # 外卖首页整屏是图,用户一天开三次就重下三次——用户流量、加载速度、
  # 平台带宽三头都亏。只在本地落盘,不上报任何数据
  cached_network_image: ^3.4.1
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  flutter_map: ^8.3.1
  http: ^1.2.0
  jpush_flutter:            # vendor 版,适配 AGP 9(见 packages/jpush_flutter)
    path: ../jpush_flutter
  latlong2: ^0.10.1
  package_info_plus: ^8.0.0   # 读当前版本号(应用内更新检查)
  path_provider: ^2.1.4       # 安装包落应用私有目录(免存储权限)
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.0        # 打开新版 APK 下载链接

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  # 拉丁字母与数字的字体子集(中文一律回落系统字);来源与复现见
  # assets/fonts/README.md,两款均为 OFL 1.1(各自的 OFL-*.txt)
  fonts:
    # 衬线(Literata):金额、评分、距离等数字
    - family: SzSerif
      fonts:
        - asset: assets/fonts/SzSerif-Regular.ttf
        - asset: assets/fonts/SzSerif-Semibold.ttf
          weight: 600
    # 无衬线(Space Grotesk):界面里的拉丁词与英文
    - family: SzSans
      fonts:
        - asset: assets/fonts/SzSans-Regular.ttf
        - asset: assets/fonts/SzSans-Semibold.ttf
          weight: 600
